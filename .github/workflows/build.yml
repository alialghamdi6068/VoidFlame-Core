name: Build VoidFlame-Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build --no-daemon
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: VoidFlame-Core
          path: build/libs/*.jar
