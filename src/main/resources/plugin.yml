name: VoidFlame-Core
version: 2.0.0
main: net.voidflame.core.VoidFlameCorePlugin
description: Shared persistence, storage API and infrastructure for VoidFlameMC SMP.
author: VoidFlame
website: https://github.com/alialghamdi6068/VoidFlame-Core
api-version: '26.2'
load: STARTUP
prefix: VoidFlame-Core
softdepend:
  - LuckPerms
  - PlaceholderAPI
  - Multiverse-Core

commands:
  spawn:
    description: Return to the VoidFlameMC spawn.
    usage: /spawn
    permission: voidflame.spawn
  vfrestore:
    description: Restore a validated Core database backup.
    usage: /vfrestore <backup-file>
    permission: voidflame.database.restore
  vfworld:
    description: Administrative world manager.
    usage: /vfworld <help|list|info|enable|disable|load|unload|tp|setspawn|reload> [world]
    permission: voidflame.world.manage

permissions:
  voidflame.spawn:
    description: Return to the main SMP spawn.
    default: true
  voidflame.database.restore:
    description: Restore a validated Core database backup.
    default: op
  voidflame.world.manage:
    description: Manage server worlds.
    default: op
