# ================================================================
# VoidFlame Core • Production Configuration
# Paper 26.2 • Java 25
# ================================================================
# Single source of truth for storage, worlds, migrations and backups.
settings:
  metrics: false
  debug: false
  locale: en_US
  timezone: UTC
  cache-enabled: true
  async-storage: true
  flush-on-shutdown: true
  validate-settings: true

database:
  connection-timeout-seconds: 15
  busy-timeout-milliseconds: 5000
  wal: true
  foreign-keys: true
  migrations: true
  restore-requires-restart: true
  backups:
    enabled: true
    interval-minutes: 30
    keep: 10

worlds:
  enabled:
    - world
  spawns: {}
