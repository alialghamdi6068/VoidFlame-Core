# VoidFlame-Core | VoidFlameMC Practice & Duels
# Paper 26.2 / Java 25
# All custom VoidFlame plugins share plugins/VoidFlame-Core/database.db.
# Never create a separate database in a feature plugin.

settings:
  metrics: false
  debug: false
  locale: en_US
  timezone: UTC
  cache-enabled: true
  async-storage: true
  flush-on-shutdown: true
  validate-settings: true

database:
  connection-timeout-seconds: 15
  busy-timeout-milliseconds: 5000
  wal: true
  foreign-keys: true
  migrations: true
  restore-requires-restart: true
  backups:
    enabled: true
    interval-minutes: 30
    keep: 10
    directory: backups

plugins:
  registry-enabled: true
  centralize-custom-data: true

storage:
  namespace-isolation: true
  validate-keys: true
  max-value-bytes: 1048576

spawn:
  world: duelpvp

worlds:
  enabled:
    - duelpvp
  spawns: {}
